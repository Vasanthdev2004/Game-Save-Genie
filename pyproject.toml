[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-save-genie"
version = "0.8.2"
description = "Self-hosted cloud save sync for the games that don't have it - auto-backup, versioning, and cross-machine restore built on Ludusavi + rclone"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Vasanthdev2004"}]
requires-python = ">=3.10"
keywords = ["game-saves", "backup", "cloud-sync", "ludusavi", "rclone", "save-manager", "hydra"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Archiving :: Backup",
]

dependencies = [
    "typer>=0.12.0",
    "click>=8.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "platformdirs>=4.0",
    "requests>=2.31.0",
    "rich>=13.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "watchdog>=3.0",
    # Tray icon. Optional at runtime — gsg.tray degrades to a no-op if these
    # are missing or there is no notification area — but installed by default
    # because a hidden background daemon with no visible status is the single
    # worst thing about running one.
    "pystray>=0.19",
    "Pillow>=10.0",
    # Interactive dashboard (`gsg ui`). Same author as rich, which is already
    # a dependency; the command degrades to a clear error if it is missing.
    "textual>=0.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    # Linters are pinned to a minor series on purpose. Unbounded ranges mean an
    # upstream release changes what "passing" means and breaks CI on an
    # unrelated PR — ruff 0.16 widened its default rule set and did exactly
    # that. Bumping these should be its own commit, with the fixes alongside.
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<2.4",
    "types-PyYAML",
    "types-psutil",
]

[project.urls]
Repository = "https://github.com/Vasanthdev2004/Game-Save-Genie"
Issues = "https://github.com/Vasanthdev2004/Game-Save-Genie/issues"
Changelog = "https://github.com/Vasanthdev2004/Game-Save-Genie/blob/main/CHANGELOG.md"

[project.scripts]
gsg = "game_save_genie.cli:app"
game-save-genie = "game_save_genie.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
game_save_genie = ["py.typed", "assets/tray/*.png"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Selected explicitly rather than relying on ruff's defaults, which are not
# stable across releases. Adding a rule should be a deliberate change with its
# fixes in the same commit, not something a `pip install` decides for us.
select = [
    "E4", "E7", "E9",  # pycodestyle (the subset ruff enables by default)
    "F",               # pyflakes
    "I",               # import sorting
    "UP",              # pyupgrade
    "B",               # bugbear
    "SIM",             # simplify
    "DTZ",             # naive datetimes
    "PERF",            # obvious performance traps
    "FURB",            # modernization
    "PIE",             # misc lints
    "PLE", "PLW",      # pylint errors + warnings
    "RUF",             # ruff-specific
]
ignore = [
    # Typer's entire API is `def cmd(x: T = typer.Option(...))`. A function
    # call in a default argument is the required idiom here, not a bug.
    "B008",
    # Per-item try/except inside a loop is deliberate throughout: one
    # unreadable save file, one dead process handle, or one locked path must
    # not abort a backup of everything else. The overhead is irrelevant next
    # to the disk and network work in the same loop.
    "PERF203",
    # try/except/pass reads fine and is used in cleanup paths; swapping it for
    # contextlib.suppress is churn in exactly the code that must not change
    # behaviour.
    "SIM105",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# pystray ships no py.typed marker. It is reached only through gsg.tray, which
# holds it behind Any-typed parameters precisely so the rest of the codebase
# stays strictly typed.
module = ["pystray", "pystray.*"]
ignore_missing_imports = true
