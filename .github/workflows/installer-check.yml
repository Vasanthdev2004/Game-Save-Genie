name: Installer check

on:
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/installer-check.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

jobs:
  build-and-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Build via the script rather than a duplicate command line: the two
      # drifted once, and the released exe lost its icon and tray glyphs.
      - name: Build gsg.exe
        shell: pwsh
        run: |
          pip install . pyinstaller
          .\packaging\build_exe.ps1
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss /DMyAppVersion=0.0.0
          if (-not (Test-Path "dist\GameSaveGenie-Setup.exe")) { throw "installer not produced" }
      - name: Silent install + smoke test
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath "dist\GameSaveGenie-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART"
          $exe = "$env:LOCALAPPDATA\Programs\Game Save Genie\gsg.exe"
          if (-not (Test-Path $exe)) { throw "gsg.exe not installed" }
          & $exe --version
          # The dashboard is what the Start Menu shortcut opens, so verify it
          # survives freezing. Non-interactive here, so the expected answer is
          # "needs an interactive terminal"; a missing-dependency message would
          # mean Textual never made it into the bundle.
          # `gsg ui` exits 1 without a terminal by design, so assert on the
          # message and clear the code rather than letting it fail the step.
          $PSNativeCommandUseErrorActionPreference = $false
          $out = & $exe ui | Out-String
          $global:LASTEXITCODE = 0
          if ($out -notmatch "interactive terminal") {
            throw "gsg ui is broken in the installed exe: $out"
          }
          $path = (Get-ItemProperty -Path "HKCU:\Environment" -Name Path).Path
          if ($path -notlike "*Game Save Genie*") { throw "install dir not added to user PATH" }
      - name: Silent uninstall + verify cleanup
        shell: pwsh
        run: |
          $uninst = "$env:LOCALAPPDATA\Programs\Game Save Genie\unins000.exe"
          Start-Process -Wait -FilePath $uninst -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART"
          if (Test-Path "$env:LOCALAPPDATA\Programs\Game Save Genie\gsg.exe") { throw "gsg.exe still present after uninstall" }
          $path = (Get-ItemProperty -Path "HKCU:\Environment" -Name Path -ErrorAction SilentlyContinue).Path
          if ($path -like "*Game Save Genie*") { throw "install dir left in user PATH after uninstall" }
