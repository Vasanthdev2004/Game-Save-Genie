name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"

      # Without rclone on the runner, tests/test_cloud_cas.py skips whole -
      # and that file is the only place upload_save_cas, download_save_cas,
      # prune_remote_versions and gc_blobs are exercised. The functions that
      # can DELETE a save had strictly less CI coverage than the ones that
      # already shipped four hotfixes (#44). The tests use a local remote, so
      # any rclone build will do; no credentials are involved.
      - name: Install rclone (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rclone
      - name: Install rclone (Windows)
        if: runner.os == 'Windows'
        run: choco install rclone -y --no-progress
      - name: Confirm the cloud tests are not silently skipping
        shell: bash
        run: |
          rclone version
          # A skip here is the failure mode this step exists to prevent, so
          # make it loud rather than letting the suite report green.
          pytest tests/test_cloud_cas.py -q -rs --no-header | tee /tmp/cas.txt
          if grep -q "skipped" /tmp/cas.txt; then
            echo "::error::cloud tests skipped despite rclone being installed"
            exit 1
          fi

      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src tests
      - name: Test
        run: pytest -q

  # The matrix above installs .[dev], so a dev tool can supply a runtime
  # dependency and hide a missing declaration indefinitely. black depends on
  # click, which is why every job stayed green while `import click` had no
  # declared supplier and a user hit ModuleNotFoundError on first run (#20).
  runtime-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Checks the declaration, so it catches imports that are unreachable at
      # module scope too. Runs before install: it reads files, not the env.
      - name: Every third-party import is declared
        run: python packaging/check_deps.py

      # No [dev]. This is the environment a user actually gets.
      - name: Install runtime dependencies only
        run: pip install .

      - name: Import every module
        run: |
          python - <<'EOF'
          import importlib, pkgutil, game_save_genie
          for module in pkgutil.walk_packages(
              game_save_genie.__path__, "game_save_genie."
          ):
              importlib.import_module(module.name)
              print("ok", module.name)
          EOF

      - name: Entry point runs
        run: |
          gsg --version
          gsg --help > /dev/null
