name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install . pyinstaller
      # Build via the script, not a copy of its command line. When these
      # drifted, the released exe shipped with no icon and no tray glyphs
      # while the script had both.
      - name: Build gsg.exe
        shell: pwsh
        run: .\packaging\build_exe.ps1
      - name: Smoke test
        shell: pwsh
        run: |
          dist\gsg.exe --version
          # Non-interactive, so this must report the terminal - reporting a
          # missing dependency would mean Textual is not in the bundle.
          # `gsg ui` exits 1 without a terminal by design, so assert on the
          # message and clear the code rather than letting it fail the step.
          $PSNativeCommandUseErrorActionPreference = $false
          $out = & dist\gsg.exe ui | Out-String
          $global:LASTEXITCODE = 0
          if ($out -notmatch "interactive terminal") {
            throw "gsg ui is broken in the frozen exe: $out"
          }
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss /DMyAppVersion=$version
          if (-not (Test-Path "dist\GameSaveGenie-Setup.exe")) { throw "installer not produced" }
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/gsg.exe
            dist/GameSaveGenie-Setup.exe
          generate_release_notes: true
